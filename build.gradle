buildscript {
	repositories {
		mavenCentral()
		maven { url "https://maven.fabricmc.net" }
		maven { url "https://repo.sleeping.town" }
	}
	dependencies {
		classpath "agency.highlysuspect:voldeloom:2.4" 
	}
}

apply plugin: "agency.highlysuspect.voldeloom"

java.toolchain.languageVersion = JavaLanguageVersion.of(11) //Last version able to set a --release as low as 6
compileJava.options.release.set(6) //Forge doesn't understand classes compiled to versions of the class-file format newer than Java 6's

String minecraftVersion = "1.6.4"
String forgeVersion = "1.6.4-9.11.1.1345"

dependencies {
	minecraft "com.mojang:minecraft:${minecraftVersion}"
	forge "net.minecraftforge:forge:${forgeVersion}:universal" //no @zip — Forge maven only hosts the universal as a .jar now
	mappings "net.minecraftforge:forge:${forgeVersion}:src@zip"
}

volde {
	//more configuration goes here...
}

// This mod ships an FML core-mod (an ASM class transformer that redirects Minecraft's exclusive-fullscreen
// calls to the borderless engine). FML discovers a core-mod from the jar manifest in production, and from the
// `fml.coreMods.load` system property in a dev workspace.

String coreModClass = "com.teknicallity.legacyborderless.coremod.LegacyBorderlessCorePlugin"

jar {
	manifest {
		attributes(
			"FMLCorePlugin": coreModClass,
			// Also load the @Mod (key binding + tick handler) from this same core-mod jar.
			"FMLCorePluginContainsFMLMod": "true"
		)
	}
}

// Load the core-mod when launching the game from Gradle/the IDE (`runClient`).
afterEvaluate {
	tasks.matching { it.name == "runClient" }.configureEach {
		jvmArgs "-Dfml.coreMods.load=${coreModClass}"
		// Opt-in debug: `./gradlew runClient -PlbDebug` auto-cycles borderless and dumps diagnostics.
		if (project.hasProperty("lbDebug")) {
			jvmArgs "-Dlegacyborderless.debugAutoCycle=true"
		}
		// Experiment with the anti-fullscreen-optimization overscan: `./gradlew runClient -PlbOverscan=2`.
		if (project.hasProperty("lbOverscan")) {
			jvmArgs "-Dlegacyborderless.overscan=${project.property('lbOverscan')}"
		}
	}
}